# fly.toml — deploy-ready config for the options_api container.
# First-time: fly launch --copy-config  (or: fly apps create options-api)
# Then set CORS for your Vercel origin:
#   fly secrets set CORS_ORIGIN=https://options-pricing-library-c.vercel.app
# Deploy:
#   fly deploy
app = "options-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
