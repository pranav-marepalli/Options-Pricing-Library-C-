services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      CORS_ORIGIN: "http://localhost:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Browser-side URL — host machine reaches the published api port.
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
